# Tira o aviso de férias às 00:00 de 15 de outubro de 2026, hora de Portugal —
# o dia em que a casa reabre.
#
# ## Porque é que isto existe
#
# O aviso volta ao site a 18 de setembro (PR #58, também por tarefa agendada:
# `publicar-ferias.yml`). O código já o esconde no browser a partir de dia 15,
# mas continua no HTML: podia piscar ao abrir a página, e quem não corre
# JavaScript — o Google incluído — continuava a vê-lo. O Gonçalo quer o site
# sem aviso nenhum a partir de dia 15, por isso o código sai também.
#
# Esta tarefa faz o merge do PR do branch `ferias/retirar-dia-15`, que tira o
# aviso e deixa o site como estava antes dele; a Vercel vê o push na `main` e
# publica.
#
# ## O que convém saber
#
# - 23:00 UTC de 14 de outubro são as 00:00 de 15 em Lisboa (ainda hora de
#   verão, UTC+1 — só muda a 25 de outubro).
# - O GitHub pode atrasar tarefas agendadas alguns minutos. Se às 00:15 o
#   aviso ainda estiver no site, faz-se o merge do PR à mão.
# - O cron não tem ano. A guarda da data abaixo impede que corra em 2027.
# - **O próprio PR apaga este ficheiro.** Depois do merge, isto deixa de
#   existir na `main` e não volta a correr.
# - Para testar sem mexer no site: Actions → "Retirar aviso de férias" → Run
#   workflow, com "ensaio" ligado (é o valor por omissão).
# - O merge é feito com o token do próprio workflow. Um push feito com esse
#   token não arranca outros workflows (o CI não corre sobre o merge), mas a
#   Vercel recebe-o na mesma e publica — o CI já correu no PR.

name: Retirar aviso de férias

on:
  schedule:
    - cron: "0 23 14 10 *"
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Só verificar, sem fazer merge"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  retirar:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ferias/retirar-dia-15

    steps:
      - name: Confirmar a data
        if: github.event_name == 'schedule'
        run: |
          hoje=$(TZ=Europe/Lisbon date +%F)
          echo "Hoje em Lisboa: $hoje"
          if [[ "$hoje" < "2026-10-14" || "$hoje" > "2026-10-31" ]]; then
            echo "Fora da reabertura de 2026 — não faço nada."
            exit 1
          fi

      - name: Confirmar o PR
        run: |
          gh pr view "$BRANCH" --json number,state,mergeable,title \
            --jq '"PR #\(.number) · \(.state) · \(.mergeable) · \(.title)"'
          estado=$(gh pr view "$BRANCH" --json state --jq .state)
          if [[ "$estado" != "OPEN" ]]; then
            echo "O PR já não está aberto ($estado) — não há nada para retirar."
            exit 1
          fi

      - name: Merge
        if: github.event_name == 'schedule' || inputs.ensaio == false
        run: |
          gh pr merge "$BRANCH" --merge \
            --subject "Merge: a casa reabre, o aviso de férias sai do site (agendado)"
          echo "Feito. A Vercel publica a partir do push na main."

      - name: Ensaio
        if: github.event_name == 'workflow_dispatch' && inputs.ensaio == true
        run: echo "Ensaio — tudo pronto, e nada foi retirado."
