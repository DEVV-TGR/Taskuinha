# Publica o aviso de férias às 00:00 de 18 de setembro de 2026, hora de Portugal.
#
# ## Porque é que isto existe
#
# O aviso chegou a estar no site (PR #56), e o Gonçalo pediu para só aparecer
# no dia 18. Saiu da `main` no commit "O aviso de férias sai do site" e ficou
# num PR pronto, no branch `ferias/publicar-dia-18`. Esta tarefa faz o merge
# desse PR à hora certa; a Vercel vê o push na `main` e publica.
#
# ## O que convém saber
#
# - 23:00 UTC de 17 de setembro são as 00:00 de 18 em Lisboa (hora de verão,
#   UTC+1).
# - O GitHub pode atrasar tarefas agendadas alguns minutos. Se às 00:15 o
#   aviso ainda não estiver no site, faz-se o merge do PR à mão.
# - O cron não tem ano. A guarda da data abaixo impede que corra outra vez em
#   2027.
# - **O próprio PR apaga este ficheiro.** Depois do merge, isto deixa de
#   existir na `main` e não volta a correr.
# - Para testar sem publicar: Actions → "Publicar aviso de férias" → Run
#   workflow, com "ensaio" ligado (é o valor por omissão).
# - O merge é feito com o token do próprio workflow. Um push feito com esse
#   token não arranca outros workflows (o CI não corre sobre o merge), mas a
#   Vercel recebe-o na mesma e publica — o CI já correu no PR.

name: Publicar aviso de férias

on:
  schedule:
    - cron: "0 23 17 9 *"
  workflow_dispatch:
    inputs:
      ensaio:
        description: "Só verificar, sem fazer merge"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ferias/publicar-dia-18

    steps:
      - name: Confirmar a data
        if: github.event_name == 'schedule'
        run: |
          hoje=$(TZ=Europe/Lisbon date +%F)
          echo "Hoje em Lisboa: $hoje"
          if [[ "$hoje" < "2026-09-17" || "$hoje" > "2026-10-14" ]]; then
            echo "Fora das férias de 2026 — não faço nada."
            exit 1
          fi

      - name: Confirmar o PR
        run: |
          gh pr view "$BRANCH" --json number,state,mergeable,title \
            --jq '"PR #\(.number) · \(.state) · \(.mergeable) · \(.title)"'
          estado=$(gh pr view "$BRANCH" --json state --jq .state)
          if [[ "$estado" != "OPEN" ]]; then
            echo "O PR já não está aberto ($estado) — não há nada para publicar."
            exit 1
          fi

      - name: Merge
        if: github.event_name == 'schedule' || inputs.ensaio == false
        run: |
          gh pr merge "$BRANCH" --merge \
            --subject "Merge: o aviso de férias volta ao site, 18 de setembro (agendado)"
          echo "Feito. A Vercel publica a partir do push na main."

      - name: Ensaio
        if: github.event_name == 'workflow_dispatch' && inputs.ensaio == true
        run: echo "Ensaio — tudo pronto, e nada foi publicado."
